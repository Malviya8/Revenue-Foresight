[theme]
base = "dark"
primaryColor = "#FF6A3D"
backgroundColor = "#0A0A0D"
secondaryBackgroundColor = "#16161A"
textColor = "#ECECEE"
font = "sans serif"

[server]
# Serves ./static, which is where the logo lives.
enableStaticServing = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
